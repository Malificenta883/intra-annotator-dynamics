<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="330" rx="10" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6a64"/>
    </marker>
  </defs>
  <!-- column headers -->
  <text x="30" y="38" font-size="15" font-weight="700" fill="#1d1d1b">1 · Read</text>
  <text x="282" y="38" font-size="15" font-weight="700" fill="#1d1d1b">2 · Cut and name</text>
  <text x="560" y="38" font-size="15" font-weight="700" fill="#1d1d1b">3 · Compare a reader with itself</text>

  <!-- 1 Read -->
  <g>
    <rect x="30" y="58" width="44" height="56" rx="4" fill="#f3f1ea" stroke="#b9b6aa"/>
    <rect x="82" y="58" width="44" height="56" rx="4" fill="#f3f1ea" stroke="#b9b6aa"/>
    <rect x="134" y="58" width="44" height="56" rx="4" fill="#f3f1ea" stroke="#b9b6aa"/>
    <g stroke="#b9b6aa" stroke-width="2">
      <line x1="38" y1="72" x2="66" y2="72"/><line x1="38" y1="82" x2="62" y2="82"/><line x1="38" y1="92" x2="66" y2="92"/><line x1="38" y1="102" x2="58" y2="102"/>
      <line x1="90" y1="72" x2="118" y2="72"/><line x1="90" y1="82" x2="114" y2="82"/><line x1="90" y1="92" x2="118" y2="92"/><line x1="90" y1="102" x2="110" y2="102"/>
      <line x1="142" y1="72" x2="170" y2="72"/><line x1="142" y1="82" x2="166" y2="82"/><line x1="142" y1="92" x2="170" y2="92"/><line x1="142" y1="102" x2="162" y2="102"/>
    </g>
    <text x="30" y="136" font-size="13" fill="#1d1d1b">3 old myths from Sumer</text>
    <text x="30" y="178" font-size="13" font-weight="700" fill="#1d1d1b">1 human</text>
    <text x="30" y="196" font-size="13" fill="#4a4944">3 runs, months apart</text>
    <text x="30" y="230" font-size="13" font-weight="700" fill="#1d1d1b">3 AI models</text>
    <text x="30" y="248" font-size="13" fill="#4a4944">Opus, Gemini, Qwen:</text>
    <text x="30" y="266" font-size="13" fill="#4a4944">10 runs each</text>
  </g>
  <line x1="232" y1="160" x2="268" y2="160" stroke="#6b6a64" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 2 Cut and name -->
  <g font-size="11">
    <text x="282" y="72" font-size="12" fill="#4a4944">one run of one reader:</text>
    <rect x="282" y="82"  width="44" height="34" fill="#2a78d6"/><text x="304" y="103" text-anchor="middle" fill="#fff">prep</text>
    <rect x="328" y="82"  width="40" height="34" fill="#eb6834"/><text x="348" y="103" text-anchor="middle" fill="#1d1d1b">cont</text>
    <rect x="370" y="82"  width="62" height="34" fill="#e87ba4"/><text x="401" y="103" text-anchor="middle" fill="#1d1d1b">nego</text>
    <rect x="434" y="82"  width="44" height="34" fill="#eda100"/><text x="456" y="103" text-anchor="middle" fill="#1d1d1b">disr</text>
    <rect x="480" y="82"  width="42" height="34" fill="#008300"/><text x="501" y="103" text-anchor="middle" fill="#fff">stab</text>
  </g>
  <text x="282" y="146" font-size="13" fill="#1d1d1b">The reader cuts the text into parts</text>
  <text x="282" y="164" font-size="13" fill="#1d1d1b">and gives each part one of 7 labels:</text>
  <text x="282" y="190" font-size="12" fill="#4a4944">preparation · contact · exchange</text>
  <text x="282" y="207" font-size="12" fill="#4a4944">disruption · negotiation</text>
  <text x="282" y="224" font-size="12" fill="#4a4944">stabilization · return</text>
  <text x="282" y="256" font-size="12" fill="#6b6a64">gap between blocks = a cut</text>
  <line x1="530" y1="160" x2="552" y2="160" stroke="#6b6a64" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 3 Compare -->
  <g font-size="11">
    <text x="560" y="68" font-size="13" font-weight="700" fill="#1d1d1b">Human</text>
    <text x="560" y="92" font-size="11" fill="#4a4944">run 1</text>
    <rect x="610" y="78" width="44" height="22" fill="#2a78d6"/><text x="632" y="93" text-anchor="middle" fill="#fff">prep</text>
    <rect x="656" y="78" width="40" height="22" fill="#eb6834"/><text x="676" y="93" text-anchor="middle" fill="#1d1d1b">cont</text>
    <rect x="698" y="78" width="62" height="22" fill="#e87ba4"/><text x="729" y="93" text-anchor="middle" fill="#1d1d1b">nego</text>
    <rect x="762" y="78" width="44" height="22" fill="#eda100"/><text x="784" y="93" text-anchor="middle" fill="#1d1d1b">disr</text>
    <rect x="808" y="78" width="42" height="22" fill="#008300"/><text x="829" y="93" text-anchor="middle" fill="#fff">stab</text>
    <text x="560" y="120" font-size="11" fill="#4a4944">run 2</text>
    <rect x="610" y="106" width="44" height="22" fill="#2a78d6"/><text x="632" y="121" text-anchor="middle" fill="#fff">prep</text>
    <rect x="656" y="106" width="40" height="22" fill="#e87ba4"/><text x="676" y="121" text-anchor="middle" fill="#1d1d1b">nego</text>
    <rect x="698" y="106" width="62" height="22" fill="#1baf7a"/><text x="729" y="121" text-anchor="middle" fill="#1d1d1b">exch</text>
    <rect x="762" y="106" width="44" height="22" fill="#eda100"/><text x="784" y="121" text-anchor="middle" fill="#1d1d1b">disr</text>
    <rect x="808" y="106" width="42" height="22" fill="#008300"/><text x="829" y="121" text-anchor="middle" fill="#fff">stab</text>
    <text x="610" y="148" font-size="12.5" fill="#1d1d1b">cuts: <tspan font-weight="700" fill="#1a7f37">mostly same ✓</tspan>   labels: <tspan font-weight="700" fill="#c0392b">change ✗</tspan></text>

    <text x="560" y="190" font-size="13" font-weight="700" fill="#1d1d1b">AI model</text>
    <text x="560" y="214" font-size="11" fill="#4a4944">run 1</text>
    <rect x="610" y="200" width="44" height="22" fill="#2a78d6"/><text x="632" y="215" text-anchor="middle" fill="#fff">prep</text>
    <rect x="656" y="200" width="40" height="22" fill="#eb6834"/><text x="676" y="215" text-anchor="middle" fill="#1d1d1b">cont</text>
    <rect x="698" y="200" width="62" height="22" fill="#e87ba4"/><text x="729" y="215" text-anchor="middle" fill="#1d1d1b">nego</text>
    <rect x="762" y="200" width="44" height="22" fill="#eda100"/><text x="784" y="215" text-anchor="middle" fill="#1d1d1b">disr</text>
    <rect x="808" y="200" width="42" height="22" fill="#008300"/><text x="829" y="215" text-anchor="middle" fill="#fff">stab</text>
    <text x="560" y="242" font-size="11" fill="#4a4944">run 2</text>
    <rect x="610" y="228" width="44" height="22" fill="#2a78d6"/><text x="632" y="243" text-anchor="middle" fill="#fff">prep</text>
    <rect x="656" y="228" width="40" height="22" fill="#eb6834"/><text x="676" y="243" text-anchor="middle" fill="#1d1d1b">cont</text>
    <rect x="698" y="228" width="62" height="22" fill="#e87ba4"/><text x="729" y="243" text-anchor="middle" fill="#1d1d1b">nego</text>
    <rect x="762" y="228" width="44" height="22" fill="#eda100"/><text x="784" y="243" text-anchor="middle" fill="#1d1d1b">disr</text>
    <rect x="808" y="228" width="42" height="22" fill="#008300"/><text x="829" y="243" text-anchor="middle" fill="#fff">stab</text>
    <text x="610" y="270" font-size="12.5" fill="#1d1d1b">cuts: <tspan font-weight="700" fill="#1a7f37">mostly same ✓</tspan>   labels: <tspan font-weight="700" fill="#1a7f37">mostly same ✓</tspan></text>
  </g>
  <text x="30" y="312" font-size="12" fill="#6b6a64">Schematic, not real data. Real runs: results/fig1_phase.png</text>
</svg>
